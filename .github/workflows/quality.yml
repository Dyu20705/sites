name: Repository quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Repository policy and frozen evidence hashes
        run: python3 tools/check_repository.py

  tests:
    name: tests-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.14']
        exclude:
          - os: windows-2025
            python: '3.12'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python modules
        shell: bash
        run: |
          if [ -d sites_demo ]; then python -m compileall -q sites_demo; fi
          if [ -d tests ]; then python -m compileall -q tests; fi
      - name: Product regression tests (when present)
        shell: bash
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -p 'test_*.py' -v; else echo 'No product code in baseline'; fi
      - name: Research regression tests (when present)
        shell: bash
        run: |
          if [ -d experiments/research_exit_20260927 ]; then python -m unittest discover -s experiments/research_exit_20260927 -p 'test_*.py' -v; else echo 'Research evidence not merged'; fi
      - name: Frozen evidence integrity (when present)
        shell: bash
        run: python tools/check_repository.py --freeze-only

# CI on hosted runners is not an independent reviewer and does not establish E3/E7/E8.
