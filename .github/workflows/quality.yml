name: Repository quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Documentation and repository integrity
        run: python3 tools/check_repository.py

  tests:
    name: tests-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-2025, python: '3.14.7'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source and test code
        shell: bash
        run: |
          if [ -d sites_demo ]; then python -m compileall -q sites_demo; fi
          if [ -d tests ]; then python -m compileall -q tests; fi
      - name: Portable contract tests and accepted-target product suite
        shell: bash
        run: |
          if [ ! -d tests ]; then
            echo 'No product suite on this baseline'
          elif [ "${{ matrix.os }}" = "windows-2025" ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            # The full demo explicitly requires Windows CPython 3.14.7.
            # Do not relax its frozen runtime/evaluation contract on Linux.
            python -m unittest discover -s tests -p 'test_contracts_portable.py' -v
          fi
      - name: Research regression suite
        shell: bash
        run: |
          if [ -d experiments/research_exit_20260927 ]; then
            python -m unittest discover -s experiments/research_exit_20260927 -p 'test_*.py' -v
          else
            echo 'Research evidence not merged'
          fi
      - name: Frozen artifact hashes
        shell: bash
        run: python tools/check_repository.py --freeze-only

# Hosted CI is development assurance, not independent human E7/E8 or scientific quality evidence.
